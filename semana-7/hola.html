<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador Rick and Morty</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="min-h-dvh bg-slate-100 text-slate-900">

  <!-- Navegación -->
  <header class="sticky top-0 z-10 bg-white shadow">
    <nav class="relative mx-auto flex max-w-6xl items-center justify-between p-4">
      <a href="#" class="text-xl font-bold text-indigo-600">
        Multiverso<span class="text-slate-900">Explorer</span>
      </a>
      <button id="btn-menu" type="button"
              class="rounded-lg p-2 text-2xl hover:bg-slate-100 md:hidden"
              aria-label="Abrir menú" aria-controls="menu" aria-expanded="false">☰</button>
      <ul id="menu"
          class="absolute top-full right-0 left-0 hidden flex-col gap-1 bg-white p-4 shadow-lg
                 md:static md:flex md:flex-row md:gap-6 md:bg-transparent md:p-0 md:shadow-none">
        <li><a href="#" class="block rounded-lg px-3 py-2 font-medium text-indigo-600 md:p-0">Personajes</a></li>
        <li><a href="#" class="block rounded-lg px-3 py-2 text-slate-700 hover:bg-slate-100 hover:text-indigo-600 md:p-0 md:hover:bg-transparent">Episodios</a></li>
        <li><a href="#" class="block rounded-lg px-3 py-2 text-slate-700 hover:bg-slate-100 hover:text-indigo-600 md:p-0 md:hover:bg-transparent">Favoritos</a></li>
      </ul>
    </nav>
  </header>

  <main class="mx-auto max-w-6xl p-4">
    <h1 class="mt-4 text-3xl font-bold md:text-4xl">Personajes de Rick and Morty</h1>
    <p id="contador" class="mt-1 text-slate-500">Cargando...</p>

    <!-- Formulario de filtros y buscador (Pasos 3 y 4) -->
    <form id="form-filtros" class="mt-4 flex flex-col gap-4 sm:flex-row">
      <input 
        type="search" 
        id="input-buscador" 
        placeholder="Buscar por nombre..." 
        autocomplete="off"
        class="flex-1 rounded-lg border border-slate-300 bg-white px-4 py-2 text-slate-900 focus:border-indigo-600 focus:outline-none"
      >
      <select 
        id="select-status"
        class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-slate-900 focus:border-indigo-600 focus:outline-none"
      >
        <option value="">Todos los estados</option>
        <option value="Alive">Alive</option>
        <option value="Dead">Dead</option>
        <option value="unknown">Unknown</option>
      </select>
    </form>

    <h2 class="mt-6 mb-3 text-sm font-semibold tracking-wide text-slate-500 uppercase">Resultados</h2>
    
    <!-- Grilla VACÍA para que JavaScript inyecte las tarjetas dinámicamente (Paso 2) -->
    <section id="grilla" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
      <!-- Las tarjetas se generan desde app.js -->
    </section>
  </main>

  <footer class="mt-12 border-t border-slate-200 py-6 text-center text-sm text-slate-500">
    Datos: <a href="https://rickandmortyapi.com" class="underline hover:text-indigo-600">The Rick and Morty API</a> · Hecho con Tailwind CSS
  </footer>

  <!-- Modal para los detalles con delegación (Paso 5) -->
  <dialog id="modal-detalle"
          class="m-auto w-full max-w-md overflow-hidden rounded-2xl bg-white p-0 shadow-2xl
                 backdrop:bg-slate-900/60 backdrop:backdrop-blur-sm">
    <div class="relative">
      <div id="modal-body" class="p-6">
        <!-- El contenido del modal se llena dinámicamente desde app.js -->
      </div>
      <button id="btn-cerrar-modal" class="absolute top-4 right-4 rounded-lg bg-slate-100 px-3 py-1 font-bold text-slate-700 hover:bg-slate-200">&times;</button>
    </div>
  </dialog>

  <!-- Script principal de la aplicación (type="module") -->
  <script type="module" src="src/js/app.js"></script>
</body>
</html>
